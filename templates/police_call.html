<!-- app/templates/police_call.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Police Call</title>
</head>
<body>
    <h1>Police Call Interface</h1>
    <p id="status">Waiting for call...</p>
    <button onclick="startCall()">Accept Call</button>
    <button onclick="endCall()">End Call</button>
    <audio id="remoteAudio" autoplay></audio>
    <script>
        let pc;
        let ws;

        let role = "police";

        async function startCall() {
            try {
                pc = new RTCPeerConnection({
                    iceServers: [{ urls: "stun:stun.l.google.com:19302" },
                                {urls: "turn:172.20.10.2:3478", username: "webrtc", credential: "my_secret" }
                    ]
                });
                ws = new WebSocket("wss://172.20.10.2:443/v1/ws/call");

                debugger

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => {
                    pc.addTrack(track, stream);
                    console.log("Police: Added track", track);
                });

                pc.onicecandidate = event => {
                    debugger
                    if (event.candidate) {
                        ws.send(JSON.stringify({ "ice": event.candidate.toJSON() }));
                        console.log("Police: Sent ICE candidate", event.candidate);
                    } else {
                        console.log("Police: ICE gathering complete");
                    }
                };

                pc.onconnectionstatechange = () => {
                    debugger
                    console.log("Police: Connection state:", pc.connectionState);
                    if (pc.connectionState === "connected") {
                        document.getElementById("status").textContent = "Connected!";
                    }
                };

                pc.ontrack = event => {
                    debugger
                    const audio = document.getElementById("remoteAudio");
                    audio.srcObject = event.streams[0];
                    console.log("Police: Received remote track", event.streams[0]);
                };

                ws.onopen = async () => {
                    debugger
                    console.log(role + " WebSocket opened");
                    ws.send(JSON.stringify({ role }));
                    if (role === "user") {
                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        ws.send(JSON.stringify({ "sdp": pc.localDescription }));
                        document.getElementById("status").textContent = "Calling...";
                    }
                };

                ws.onmessage = async (event) => {
                    const data = JSON.parse(event.data);
                    console.log("Police: Received message", data);
                    if (data.sdp) {
                        document.getElementById("status").textContent = "Call received!";
                        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                        if (data.sdp.type === "offer") {
                            debugger
                            const answer = await pc.createAnswer();
                            await pc.setLocalDescription(answer);
                            ws.send(JSON.stringify({ "sdp": pc.localDescription }));
                            console.log("Police: Sent SDP answer", pc.localDescription);
                        }
                    } else if (data.ice) {
                        debugger
                        await pc.addIceCandidate(new RTCIceCandidate(data.ice));
                        console.log("Police: Added ICE candidate", data.ice);
                    } else if (data.error) {
                        debugger
                        document.getElementById("status").textContent = "Error: " + data.error;
                        endCall();
                    }
                };

                ws.onclose = () => console.log("Police: WebSocket closed");
                ws.onerror = (error) => console.error("Police: WebSocket error", error);
            } catch (e) {
                console.error("Police: Error in startCall", e);
                document.getElementById("status").textContent = "Error: " + e.message;
                endCall();
            }
        }

        function endCall() {
            if (pc) pc.close();
            if (ws) ws.close();
            document.getElementById("status").textContent = "Call ended";
            console.log("Police: Call ended");
        }
    </script>
</body>
</html>
