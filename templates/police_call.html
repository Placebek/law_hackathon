<!-- app/templates/police_call.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Police Call</title>
</head>
<body>
    <h1>Police Call Interface</h1>
    <p id="status">Waiting for call...</p>
    <button onclick="startCall()">Accept Call</button>
    <audio id="remoteAudio" autoplay></audio>
    <script>
        let pc;
        let ws;

        async function startCall() {
            pc = new RTCPeerConnection({
                iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
            });
            ws = new WebSocket("ws://172.20.10.2:8000/v1/ws/call");

            // Захват аудио с микрофона полиции
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(track => pc.addTrack(track, stream));

            // Обработка ICE-кандидатов
            pc.onicecandidate = event => {
                if (event.candidate) {
                    ws.send(JSON.stringify({ "ice": event.candidate.toJSON() }));
                }
            };

            // Воспроизведение аудио от пользователя
            pc.ontrack = event => {
                const audio = document.getElementById("remoteAudio");
                audio.srcObject = event.streams[0];
            };

            // Обработка сообщений от сервера (ожидание offer и отправка answer)
            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                if (data.sdp) {
                    document.getElementById("status").textContent = "Call received!";
                    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    if (data.sdp.type === "offer") {
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        ws.send(JSON.stringify({ "sdp": pc.localDescription }));
                    }
                } else if (data.ice) {
                    await pc.addIceCandidate(new RTCIceCandidate(data.ice));
                }
            };
        }
    </script>
</body>
</html>
